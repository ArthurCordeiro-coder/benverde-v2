<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Lumii mark">
  <defs>
    <linearGradient id="lumii-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"></stop>
      <stop offset="100%" stop-color="#10b981"></stop>
    </linearGradient>
    <filter id="lumii-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lumii-grad)"></rect>
  
  <rect x="2" y="2" width="44" height="44" rx="13" fill="white" opacity="0.06"></rect>
  
  <g filter="url(#lumii-glow)">
    <path d="M16 12 L16 33 L31 33" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="32" cy="16" r="2.6" fill="#ffffff"></circle>
  </g>
</svg>